apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: network-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: curlimages/curl:8.10.1
          command:
            - sh
            - "-c"
            - |
              while true; do
                echo "Frontend running..."
                sleep 3600
              done
