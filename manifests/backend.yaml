apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: network-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:1.0
          args:
            - "-text=Hello from backend"
          ports:
            - containerPort: 5678
