apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: network-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: curlimages/curl:8.10.1
          command:
            - sleep
            - "3600"
